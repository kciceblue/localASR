[package]
name = "localasr"
version = "0.1.0"
edition = "2021"
description = "Cross-platform push-to-talk dictation with OpenAI-compatible ASR + editor LLM"
license = "MIT"

[lib]
name = "localasr"
path = "src/lib.rs"

[[bin]]
name = "localasr"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
cpal = "0.15"
arboard = "3"
anyhow = "1"
futures = "0.3"
thiserror = "2"
directories = "5"
shellexpand = "3"
async-trait = "0.1"
bytes = "1"
voice_activity_detector = "0.2"
webrtc-vad = "0.4"
hound = "3"
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "wgpu"] }
ignore = "0.4"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.13", features = ["tokio"] }
eframe = { version = "0.34", default-features = false, features = ["wayland", "x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
assert_matches = "1"
